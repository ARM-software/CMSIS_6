name: Publish CoreValidation Results

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CoreValidation"]
    # avoid running once merged on main branch, this should be run only on PRs
    branches-ignore: ["main"]
    types:
      - completed

permissions: {}

jobs:
  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'skipped'

    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Download and Extract Artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/EventFile/event.json
          report_individual_runs: true
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.junit"
